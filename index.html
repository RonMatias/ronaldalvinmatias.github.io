<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        .reels-button {
            display: inline-block;
            width: 150px; /* Set width and height to make it square */
            height: 150px;
            background-color: #8a5b3f; /* Same background as My Portfolio */
            color: white;
            text-align: center;
            line-height: 150px; /* Vertically center the text */
            font-size: 18px; /* Adjust text size */
            border-radius: 10px; /* Optional: rounded corners */
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2); /* Optional: adds a shadow for effect */
            transition: background-color 0.3s ease; /* Optional: smooth transition for hover */
        }

        .reels-button:hover {
            background-color: #e88f1f; /* Change color on hover */
        }

        .gallery-background img {
            position: absolute;
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            opacity: 0.3;
            box-shadow: 2px 2px 10px rgba(255, 255, 255, 0.2);
        }

        .profile-section .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }

        /* Other styles */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
        }

        h1 {
            font-size: 3em;
        }

        .youtube-section img {
            width: 40px;
            height: 40px;
        }

        .youtube-button, .portfolio-button, .reels-button {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background-color: #f4a300;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
        }

        .youtube-button:hover, .portfolio-button:hover {
            background-color: #e88f1f;
        }

        /* Sections */
        .golden-section, .silver-section {
            margin: 20px;
            padding: 20px;
            background-color: #8a5b3f;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="gallery-background">
        <img src="design1.jpg" style="top: 10%; left: 5%; transform: rotate(-15deg);">
        <img src="design2.jpg" style="top: 30%; left: 70%; transform: rotate(10deg);">
        <img src="design3.jpg" style="top: 50%; left: 20%; transform: rotate(-5deg);">
        <img src="design4.jpg" style="top: 70%; left: 50%; transform: rotate(15deg);">
        <img src="design6.jpg" style="top: 20%; left: 40%; transform: rotate(-10deg);">
        <img src="design7.jpg" style="top: 80%; left: 80%; transform: rotate(5deg);">
        <img src="image1.jpg" style="top: 15%; left: 25%; transform: rotate(12deg);">
        <img src="image2.jpg" style="top: 60%; left: 10%; transform: rotate(-8deg);">
        <img src="image3.jpg" style="top: 40%; left: 80%; transform: rotate(18deg);">
        <img src="image4.jpg" style="top: 85%; left: 30%; transform: rotate(-12deg);">
    </div>

    <div class="profile-section">
        <img src="profile.jpg" alt="Profile Picture" class="profile-img">
    </div>

    <h1>Welcome to My Portfolio</h1>
    <p>Check out my work and subscribe to my YouTube channel!</p>
    
    <div class="youtube-section">
        <a href="https://www.youtube.com/@RonaldMatiasPortfolio" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" 
                 alt="YouTube Logo" class="youtube-logo">
        </a>
        <br>
        <a href="https://www.youtube.com/@RonaldMatiasPortfolio" target="_blank" class="youtube-button">
            Visit My YouTube Channel
        </a>
    </div>
    
    <div class="golden-section">
        <h2>My Organized Graphic Design Portfolio</h2>
        <a href="https://drive.google.com/drive/folders/1Rp_avQn5og19gSeY-EG7lmP_FGlT8Y-t?usp=drive_link" 
           target="_blank" class="portfolio-button">
            📂 View My Portfolio
        </a>
    </div>

    <div class="silver-section">
        <h2>More of My Edited Videos - Reels</h2>
        <a href="https://drive.google.com/drive/folders/1x7qGkak1nsR6CD555TFo1h1EaZvTR1VK" 
           target="_blank" class="reels-button">
            🎬 View My Reels
        </a>
    </div>
</body>
</html>
